<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07090f">
<title>BARBADOX · Slips Tracker</title>
<style>
:root{--bg:#07090f;--panel:rgba(255,255,255,.028);--panel2:rgba(255,255,255,.05);--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.14);--ink:#f4f6ff;--dim:#8b96b8;--dim2:#5c6584;--acid:#c6ff4d;--cyan:#37e0ff;--pink:#ff3d71;--amber:#ffb13d;--green:#3dff9e;--grad:linear-gradient(135deg,var(--acid),var(--cyan));--radius:20px;--shadow:0 18px 50px rgba(0,0,0,.45)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(1100px 520px at 85% -10%,rgba(55,224,255,.09),transparent 60%),radial-gradient(900px 500px at -10% 0%,rgba(198,255,77,.06),transparent 55%),var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}button{font:inherit;cursor:pointer}.mono{font-family:ui-monospace,"SF Mono",monospace}.topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:rgba(7,9,15,.78);border-bottom:1px solid var(--line)}.topbar-in{max-width:1180px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.brand{display:flex;align-items:baseline;gap:10px}.brand b{font-size:19px;font-weight:900;letter-spacing:.14em}.brand b span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}.brand small{color:var(--dim);font-size:9.5px;letter-spacing:.32em}.pill{font-size:10px;font-weight:700;letter-spacing:.12em;padding:6px 12px;border-radius:99px;border:1px solid var(--line2);background:var(--panel2);color:var(--dim);white-space:nowrap}.pill.ok{color:var(--green);border-color:rgba(61,255,158,.35)}.pill.warn{color:var(--amber);border-color:rgba(255,177,61,.35)}.shell{max-width:1180px;margin:auto;padding:26px 22px 70px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 18px}.head h1{font-size:16px;letter-spacing:.2em;margin:0}.sub{color:var(--dim);font-size:11px;margin-top:4px}.btn{border:1px solid var(--line2);border-radius:12px;padding:9px 14px;color:var(--ink);background:var(--panel2);font-size:10px;font-weight:800;letter-spacing:.12em;text-decoration:none;display:inline-flex;align-items:center;gap:7px}.btn:hover{border-color:var(--cyan);background:rgba(55,224,255,.07)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:16px 0;box-shadow:var(--shadow);position:relative;overflow:hidden}.panel:before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(198,255,77,.4),transparent)}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px}.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:15px;padding:14px 10px;text-align:center}.kpi strong{font-size:24px;font-weight:900;display:block}.kpi span{font-size:9px;letter-spacing:.15em;color:var(--dim2);display:block;margin-top:4px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}.tab{border:1px solid var(--line2);border-radius:99px;padding:8px 14px;background:transparent;color:var(--dim);font-size:10px;letter-spacing:.1em;font-weight:800}.tab.active{color:var(--acid);border-color:rgba(198,255,77,.45);background:rgba(198,255,77,.07)}.list{display:flex;flex-direction:column;gap:14px}.slip{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));border-radius:18px;padding:17px}.slip.won{border-color:rgba(61,255,158,.34)}.slip.lost{border-color:rgba(255,61,113,.38)}.slip-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}.slip-title{font-weight:900;font-size:13px;letter-spacing:.04em}.chip{font-size:9px;font-weight:900;letter-spacing:.14em;padding:5px 12px;border-radius:99px;border:1px solid}.chip.won{color:var(--green);background:rgba(61,255,158,.08);border-color:rgba(61,255,158,.35)}.chip.lost{color:var(--pink);background:rgba(255,61,113,.08);border-color:rgba(255,61,113,.4)}.chip.playable{color:var(--acid);background:rgba(198,255,77,.07);border-color:rgba(198,255,77,.32)}.chip.ongoing{color:var(--amber);background:rgba(255,177,61,.08);border-color:rgba(255,177,61,.35)}.leg{padding:12px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(190px,1.4fr) minmax(120px,.9fr) minmax(105px,.8fr);gap:8px 16px;align-items:center}.leg:first-child{border-top:0}.teams{font-weight:800;font-size:12px;line-height:1.4}.market{font-size:10px;font-weight:800;color:var(--acid);letter-spacing:.08em}.market.under{color:var(--cyan)}.meta{font-size:10px;color:var(--dim);line-height:1.7}.score{text-align:right;font-weight:900;font-size:16px;white-space:nowrap}.score.live{color:var(--cyan)}.score.won{color:var(--green)}.score.lost{color:var(--pink)}.leg-status{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--dim2);font-size:9px;letter-spacing:.06em}.refresh{color:var(--dim2);font-size:9px}.notice{padding:12px 14px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;color:var(--dim);font-size:11px;margin:12px 0}.notice.error{color:var(--pink);border-color:rgba(255,61,113,.3)}.empty{padding:38px 12px;text-align:center;color:var(--dim2);font-size:12px;line-height:2}.footer{text-align:center;color:var(--dim2);font-size:10px;letter-spacing:.25em;padding:30px 0 8px}@media(max-width:680px){.shell{padding:20px 12px 50px}.topbar-in{padding:12px}.brand small{display:none}.panel{padding:14px}.leg{grid-template-columns:1fr auto;gap:5px 12px}.leg .meta{grid-column:1/2}.score{grid-column:2;grid-row:1/3}.leg-status{grid-column:1/-1}.head h1{font-size:14px}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in"><div class="brand"><b>BARBADOX<span>·</span></b><small>MATCH INTELLIGENCE</small></div><div class="pill" id="connection">CONNECTING TO ARCHIVE…</div></div></header>
<main class="shell">
  <div class="head"><div><h1>SLIPS TRACKER</h1><div class="sub">Permanent archive · automatic score capture · automatic settlement</div></div><a class="btn" href="/">← BACK TO MODEL</a></div>
  <section class="panel"><div class="kpis" id="stats"></div><div class="filters" id="tabs"><button class="tab active" data-view="ALL">ALL</button><button class="tab" data-view="PLAYABLE">PLAYABLE</button><button class="tab" data-view="ONGOING">ONGOING</button><button class="tab" data-view="WON">WON</button><button class="tab" data-view="LOST">LOST</button></div><div class="notice" id="trackerNotice">Waiting for the permanent archive…</div><div class="list" id="slips"></div></section>
  <footer class="footer">BUILT BY AGAINBUILDS · BARBADOX</footer>
</main>
<script src="/slips_tracker.js"></script>
</body>
</html>

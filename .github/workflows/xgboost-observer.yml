
name: Barbadox XGBoost Observer

on:
  schedule:
    - cron: "17 0 */2 * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: barbadox-xgboost-observer
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-observer.txt

      - name: Run observer
        run: python xgboost_observer.py

      - name: Save observer reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/xgboost_observer/

          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update Barbadox XGBoost observer report"
            git push
          fi

name: Barbadox - Slip Tracker
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 10 * * *"
permissions:
  contents: write
concurrency:
  group: barbadox-slip-tracker
  cancel-in-progress: false
jobs:
  track-slips:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch bookmaker odds (The Odds API)
        # Missing/invalid ODDS_API_KEY prints a clear error annotation and
        # fails this step, but slip generation still runs without odds.
        continue-on-error: true
        run: python odds_snapshot.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: "eu"
      - name: Generate 3+1 slips and grade results
        run: python barbadox_slips.py
        env:
          CORE1_SLIP_THRESHOLD: "0.79"
          CORE2_SLIP_THRESHOLD: "0.75"
          MAX_NEW_SLIPS: "3"
          STAKE: "1000"
          STAKE_CURRENCY: "₦"
          PREFERRED_BOOKMAKERS: "pinnacle"
      - name: Commit slip report and permanent history
        run: |
          git config user.name "barbadox-bot"
          git config user.email "actions@users.noreply.github.com"
          git add slip.md slip_history.csv
          [ -f odds_snapshot.csv ] && git add odds_snapshot.csv
          if git diff --cached --quiet; then
            echo "No slip report or history changes."
          else
            git commit -m "Update Barbadox slip results and history"
            git push
          fi

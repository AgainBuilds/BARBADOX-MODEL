name: Barbadox - Slip

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  make-slip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate the slip
        run: python barbadox_core.py slip

      - name: Commit slip.md
        run: |
          git config user.name "barbadox-bot"
          git config user.email "actions@users.noreply.github.com"
          git add slip.md
          git diff --cached --quiet || git commit -m "Slip: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

name: Barbadox - Slip

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  make-slip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate 3+1 slips
        run: python barbadox_core.py slip

      - name: Commit slip.md
        run: |
          git config user.name "barbadox-bot"
          git config user.email "actions@users.noreply.github.com"

          git add slip.md

          if git diff --cached --quiet; then
            echo "slip.md is already up to date."
          else
            git commit -m "Refresh Barbadox 3+1 slips"
            git push
          fi

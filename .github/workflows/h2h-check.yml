name: Barbadox - H2H Check

on:
  workflow_dispatch: {}   # manual only, this is a one-off analysis, not daily operation

permissions:
  contents: read   # only reads data and prints a report, nothing to commit

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Test whether H2H history actually predicts misses
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python h2h_analysis.py

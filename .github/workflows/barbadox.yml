name: Barbadox - Run

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run today's picks
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python barbadox_core.py run --days 3

      - name: Grade yesterday's picks
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python barbadox_core.py review

      - name: Commit results
        run: |
          git config user.name "barbadox-bot"
          git config user.email "actions@users.noreply.github.com"
          git add picks.csv context.csv docs/index.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Barbadox run: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

name: Barbadox - Core 2.2 (Under 3.5)

on:
  workflow_dispatch:
    inputs:
      leagues:
        description: "Competition codes"
        required: false
        default: "PL,PD,FL1,BL1,SA"

      threshold:
        description: "Minimum probability to log a pick"
        required: false
        default: "0.80"

      test_seasons:
        description: "Season start years"
        required: false
        default: "2024,2025,2026"

      use_nb:
        description: "Use negative binomial: 1=yes, 0=Poisson"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: barbadox-core2-tracking
  cancel-in-progress: false

jobs:
  core2:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Core 2.2
        shell: bash
        run: |
          set -o pipefail
          python barbadox_core2.py 2>&1 | tee core2_run.log
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          LEAGUES: ${{ inputs.leagues || 'PL,PD,FL1,BL1,SA' }}
          THRESHOLD: ${{ inputs.threshold || '0.80' }}
          TEST_SEASONS: ${{ inputs.test_seasons || '2024,2025,2026' }}
          WARMUP_SEASONS: "2023"
          UPCOMING_DAYS: "7"
          SAFETY_Z: "1.35"
          USE_NB: ${{ inputs.use_nb || '1' }}

      - name: Merge qualifying Core 2.2 picks
        run: python core2_tracking.py
        env:
          THRESHOLD: ${{ inputs.threshold || '0.80' }}

      - name: Commit records and diagnostics
        run: |
          git config user.name "barbadox-bot"
          git config user.email "actions@users.noreply.github.com"

          git add picks.csv reports/ core2_run.log

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Run Core 2.2 Under 3.5 diagnostics"
            git push
          fi

      - name: Upload reports and console log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core2-2-2-reports
          path: |
            reports/
            core2_run.log
          if-no-files-found: warn
